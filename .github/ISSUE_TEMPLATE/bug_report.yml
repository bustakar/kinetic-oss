name: Bug report
description: Report reproducible incorrect behavior
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Kinetic.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
      placeholder: |
        1. Go to …
        2. Do …
        3. See …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, deployment type, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs or screenshots after removing secrets and personal information.
