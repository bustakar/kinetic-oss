name: Deploy development

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

env:
  VERCEL_CLI_VERSION: 58.7.1
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}

jobs:
  deploy:
    if: github.repository == 'bustakar/kinetic-oss'
    name: Deploy ${{ matrix.project }} dev
    environment: development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app
            projectId: ${{ vars.VERCEL_PROJECT_ID }}
            nitroPreset: vercel
          - project: marketing
            projectId: ${{ vars.VERCEL_MARKETING_PROJECT_ID }}
            nitroPreset: ""
    env:
      VERCEL_PROJECT_ID: ${{ matrix.projectId }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy dev
        env:
          NITRO_PRESET: ${{ matrix.nitroPreset }}
        run: |
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=dev --token="$VERCEL_TOKEN"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --target=dev --token="$VERCEL_TOKEN"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --target=dev --token="$VERCEL_TOKEN"
