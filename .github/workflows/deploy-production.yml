name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag already on main
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NITRO_PRESET: vercel
  VERCEL_CLI_VERSION: 58.7.1
  VERCEL_ORG_ID: team_esSULRmJBnOfyHWO2i1AEen4
  VERCEL_PROJECT_ID: prj_qAKuGA2bydHuJRoF58coOa7IrbR5

jobs:
  deploy:
    name: Deploy Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - name: Require a commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Deploy production
        run: |
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN"
